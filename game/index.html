<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Harbor: Rogue Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; box-shadow: 0 0 60px rgba(63, 210, 255, 0.15); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Neon Harbor: Rogue Run — a top-down open-world crime game. Walk and drive with WASD, press E to enter cars, take jobs, hire crew at their hangouts, and start street races at the marina gate, click to fire. Press C to zoom the minimap; drive into the spray shop while wanted to lose a star for $80. Press T to toggle the cab light and take fares from hailing riders."></canvas>
<!-- Harbor Heat: C toggles the minimap zoom; the spray shop, police roadblocks and the Harbor Lights finale live in src/. Crew &amp; Street Races: hire Jax, Lena and Marcus at their ringed hangouts (E on foot); start a race at the marina gate (E in a car). Cab Work: riders hail a car with its light on (T toggles it) — the meter ticks with the distance, the tip grades the ride, and Dario's Cab Boss chain pays for two fares. -->
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
